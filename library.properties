sentence=Send the sketch window, a PGraphics or any PImage over NDI®, and receive one or many NDI sources as PImages (macOS and Windows).
paragraph=A Spout/Syphon style sender and receiver for NDI® video over the local network: exchange video with OBS, vMix, Resolume, TouchDesigner and other NDI software. Works with JAVA2D, P2D and P3D, keeps transparency (BGRA), receives several sources at once with automatic reconnection, and bundles the NDI 6 runtime, so nothing else needs to be installed. NDI® is a registered trademark of Vizrt NDI AB - https://ndi.video/
